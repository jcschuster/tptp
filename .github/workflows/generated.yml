name: generated

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: mix deps.get

      - name: Regenerate from the vendored sources
        run: mix tptp.gen

      - name: The committed output must match
        run: |
          if ! git diff --exit-code; then
            echo "::error::a generated file is stale. Run 'mix tptp.gen' and commit the result."
            exit 1
          fi
