name: generated

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "28.0"

      - run: mix deps.get

      - name: Regenerate from the vendored sources
        run: mix tptp.gen

      - name: The committed output must match
        run: |
          if ! git diff --exit-code; then
            echo "::error::a generated file is stale. Run 'mix tptp.gen' and commit the result."
            exit 1
          fi
