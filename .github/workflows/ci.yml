# Continuous integration, on every push to main and every pull request.
#
# - checks: formatting, unused lock entries, a forced compile with warnings as
#   errors, Credo (strict: it carries the no-dynamic-atoms check), ExDoc with
#   warnings as errors, and the Hex package.
# - test: the default suite on the .tool-versions toolchain and on the oldest
#   supported OTP with Elixir 1.20; the :corpus and :network tags stay excluded.
#   The .tool-versions run collects coverage, printed in the log.
# - dialyzer: with its PLTs cached under their own key, so a lock-file change
#   does not rebuild them.
#
# generated.yml checks that the generated sources match the vendored BNF;
# corpus.yml reads the TPTP library; bnf.yml looks for a newer BNF nightly.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: checks-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: checks-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      # Forced: a module restored from the cache is not recompiled, and its
      # warnings would go unseen.
      - run: mix compile --warnings-as-errors --force
      - run: mix credo --strict
      - run: mix docs --warnings-as-errors
      - run: mix hex.build

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: .tool-versions
            version-file: .tool-versions
            version-type: strict
            coverage: true
          - name: OTP 28, Elixir 1.20
            otp: "28"
            elixir: "1.20"
            version-type: loose
            coverage: false
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: ${{ matrix.version-file }}
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: ${{ matrix.version-type }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - if: ${{ !matrix.coverage }}
        run: mix test --warnings-as-errors

      # ExCoveralls runs the suite and prints the per-module table; a
      # `minimum_coverage` in coveralls.json would make it a gate.
      - if: ${{ matrix.coverage }}
        run: mix coveralls --warnings-as-errors

  dialyzer:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: dialyzer-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: dialyzer-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      # The PLT is cached on its own key so a lock-file change does not also
      # rebuild it, and a cold cache costs one job rather than every job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix dialyzer --plt
      - run: mix dialyzer --format github
