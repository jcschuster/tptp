# Release: publishes the version in mix.exs to Hex and creates its GitHub release.
#
# Two ways in:
#
# - A pushed tag v<version>, for a release made by hand: the tag must name the
#   version in mix.exs.
# - A merged pull request labelled bnf-update (opened by bnf.yml): the version
#   in mix.exs is the one that pull request bumped, and the release creates the
#   tag. Merging that pull request is the human step.
#
# 1. verify: the version is not yet tagged (or, for a tag, is the tag), its
#    CHANGELOG section exists and [Unreleased] is empty, the generated sources
#    match the vendored BNF, the test suite, the package build.
# 2. hex: mix hex.publish, package and docs, through Hex's workload identity
#    ("trusted publishing", https://hex.pm/docs/workload-identity): GitHub's
#    OIDC token for this job is exchanged for a Hex token that can publish tptp
#    and nothing else, for 15 minutes. No API key is stored. The identity on
#    hex.pm names this file and the `hex` environment.
# 3. github: the GitHub release, its notes the version's CHANGELOG section.
#    It is published, not drafted, so the nightly path needs no second person;
#    publishing is what makes Zenodo mint the version's DOI.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged &&
       contains(github.event.pull_request.labels.*.name, 'bnf-update'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.event.pull_request.merge_commit_sha }}

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Read the version, and refuse one already released
        id: version
        run: |
          version=$(grep -oE '@version "[^"]+"' mix.exs | cut -d'"' -f2)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not name mix.exs version $version"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "::error::v$version is already tagged"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: The CHANGELOG has the version's section and nothing under [Unreleased]
        run: |
          grep -q "^## \[${{ steps.version.outputs.version }}\] " CHANGELOG.md
          unreleased=$(awk '/^## \[Unreleased\]/ { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md | grep -c . || true)
          if [ "$unreleased" -ne 0 ]; then
            echo "::error::CHANGELOG.md has entries under [Unreleased]; fold them into the release first"
            exit 1
          fi

      - run: mix deps.get

      - name: The generated sources match the vendored BNF
        run: mix tptp.gen --check

      - run: mix test --warnings-as-errors
      - run: MIX_ENV=dev mix hex.build

  hex:
    needs: verify
    runs-on: ubuntu-latest
    environment: hex
    permissions:
      contents: read
      id-token: write
    env:
      MIX_ENV: dev
      HEX_API_URL: https://hex.pm/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: mix deps.get

      # Mix sends HEX_API_KEY as the Authorization header as it is, hence the
      # `Bearer`. An OIDC token is exchanged once; a rerun of this job asks
      # for a new one.
      - name: Publish
        run: |
          set -euo pipefail

          audience=$(curl -fsS "$HEX_API_URL/oidc/audience" | jq -r .audience)
          oidc_token=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -r .value)

          # Not -f: on a refusal, Hex's error body is what says why.
          response=$(curl -sS -X POST "$HEX_API_URL/oauth/token" \
            -H "content-type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            --data-urlencode "assertion=$oidc_token" \
            --data-urlencode "scope=package:hexpm/tptp")

          access_token=$(printf '%s' "$response" | jq -r '.access_token // empty' 2>/dev/null || true)
          if [ -z "$access_token" ]; then
            echo "::error::Hex refused the token exchange: $response"
            echo "The workload identity on hex.pm must name jcschuster/tptp, release.yml and environment hex."
            exit 1
          fi
          echo "::add-mask::$access_token"

          HEX_API_KEY="Bearer $access_token" mix hex.publish --yes

  github:
    needs: [verify, hex]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Release notes from the CHANGELOG
        run: |
          awk -v heading="## [$VERSION] " '
            index($0, heading) == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      # For a pushed tag the tag exists and is verified; for the merged pull
      # request `gh release create --target` creates it.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            gh release create "v$VERSION" --verify-tag \
              --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "v$VERSION" --target "$SHA" \
              --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
