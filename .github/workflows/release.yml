name: release

# Publishes the version in mix.exs to Hex and creates its GitHub release and tag, when
# a pull request labelled bnf-update (opened by bnf.yml) is merged into main. The
# release notes are that version's CHANGELOG section as merged.
#
# Needs a HEX_API_KEY secret: a key with the api:write permission, made with
# `mix hex.user key generate --key-name tptp-release --permission api:write`.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'bnf-update')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "28.0"

      - name: Read the version, and refuse one already released
        id: version
        run: |
          version=$(grep -oE '@version "[^"]+"' mix.exs | cut -d'"' -f2)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "::error::v$version is already tagged"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: mix deps.get

      - name: The generated sources match the vendored BNF
        run: mix tptp.gen --check

      - name: Test what is about to be published
        env:
          MIX_ENV: test
        run: mix test

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION] " '
            index($0, heading) == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
