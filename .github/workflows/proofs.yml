name: proofs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the Lean release verify/lean-toolchain names and runs `lake build`
      # there. The proofs have no dependency beyond Lean's own library.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verify
